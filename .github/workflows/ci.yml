name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      attest-package:
        description: "Create GitHub provenance attestation for the package."
        default: "false"
        type: string
    outputs:
      artifact-basename:
        description: "Base name of the uploaded artifacts; use for artifact retrieval."
        value: ${{ jobs.package.outputs.artifact-basename }}

# Cancel active CI runs for a PR before starting another run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash  # https://github.com/beeware/briefcase/pull/912

env:
  FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: Pre-commit checks
    uses: beeware/.github/.github/workflows/pre-commit-run.yml@main
    with:
      pre-commit-source: "--group pre-commit"

  towncrier:
    name: Check towncrier
    uses: beeware/.github/.github/workflows/towncrier-run.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      tox-source: "--group tox"

  package:
    name: Package toga-console
    needs: [ pre-commit, towncrier ]
    permissions:
      id-token: write
      attestations: write
      contents: read
    uses: beeware/.github/.github/workflows/python-package-create.yml@main
    with:
      attest: ${{ inputs.attest-package }}

  unit-tests:
    name: Unit tests
    needs: [ package ]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
        runs-on: ["ubuntu-24.04"]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "${{ matrix.python-version }}"
        allow-prereleases: true

    - name: Get Packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        pattern: ${{ format('{0}*', needs.package.outputs.artifact-basename) }}
        merge-multiple: true
        path: dist

    - name: Install test requirements
      run: |
        python -m pip install -U pip
        python -m pip install --group tox

    - name: Test
      id: test
      run: |
        python -m tox -e py-cov --installpkg dist/toga_console-*.whl

    - name: Store Coverage Data
      if: always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: coverage-data-${{ matrix.python-version }}
        path: ".coverage.*"
        if-no-files-found: error
        include-hidden-files: true

    - name: Report Platform Coverage
      id: coverage
      if: always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
      # coverage reporting must use the same Python version used to produce coverage
      run: tox -qe coverage$(tr -dc "0-9" <<< "${{ matrix.python-version }}")

  native-tests:
    name: Self-test on ${{ matrix.backend }}
    needs: [ pre-commit ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: GTK
            app: console_demo
            system-packages: pkg-config libcairo2-dev libgirepository-2.0-dev gir1.2-gtk-3.0 xvfb
          - backend: Qt
            app: console_demo_qt
            system-packages: >-
              libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1
              libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 xvfb

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.13"

    - name: Install system packages
      env:
        SYSTEM_PACKAGES: ${{ matrix.system-packages }}
      run: |
        sudo apt-get update -y
        # Word splitting is wanted: the matrix gives a list of package names.
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES

    - name: Install Briefcase
      run: |
        python -m pip install -U pip
        python -m pip install briefcase

    - name: Run the demo's test suite
      working-directory: examples/console_demo
      env:
        APP: ${{ matrix.app }}
      run: xvfb-run -a briefcase dev -a "$APP" --test --no-input

  coverage:
    name: Project coverage
    runs-on: ubuntu-24.04
    needs: unit-tests
    if: always() && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'failure')
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        # Use minimum version of python for coverage to avoid phantom branches
        # https://github.com/nedbat/coveragepy/issues/1572#issuecomment-1522546425
        python-version: "3.11"

    - name: Install Tox
      run: python -m pip install --group tox

    - name: Retrieve Coverage Data
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        pattern: coverage-data-*
        merge-multiple: true

    - name: Platform Coverage Reports
      id: platform-coverage
      run: |
        tox --parallel-no-spinner -qe coverage

    - name: Project Coverage Report
      id: project-coverage
      if: always()
      run: tox -qe coverage-html

    - name: Upload Project Coverage HTML Report
      if: always() && steps.project-coverage.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: html-coverage-report-project
        path: htmlcov
