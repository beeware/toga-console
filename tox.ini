[tox]
envlist = pre-commit,py{311,312,313,314,315}-cov,coverage
labels =
    test = py-cov,coverage
    test311 = py311-cov,coverage
    test312 = py312-cov,coverage
    test313 = py313-cov,coverage
    test314 = py314-cov,coverage
    test315 = py315-cov,coverage
skip_missing_interpreters = True

[testenv:pre-commit]
skip_install = True
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure --color=always

[testenv:towncrier{,-check}]
dependency_groups = towncrier
commands =
    check  : python -m towncrier.check --compare-with origin/main
    !check : python -m towncrier {posargs}

# The leading comma generates the "py" environment.
[testenv:py{,311,312,313,314,315}{,-cov}]
package = editable
setenv =
    TOGA_BACKEND = toga_dummy
dependency_groups = test
commands =
    !cov: python -X warn_default_encoding -m pytest {posargs:-vv --color yes}
    cov: python -X warn_default_encoding -m coverage run -m pytest {posargs:-vv --color yes}

[testenv:coverage{,311,312,313,314,315}]
depends = py{,311,312,313,314,315}-cov
# by default, coverage should run on oldest supported Python for testing platform coverage.
# however, coverage for a particular Python version should match the version used for pytest.
base_python =
    coverage: py311
    coverage311: py311
    coverage312: py312
    coverage313: py313
    coverage314: py314
    coverage315: py315
skip_install = True
dependency_groups = test
commands =
    -python -m coverage combine
    html: python -m coverage html --skip-covered --skip-empty
    python -m coverage report
