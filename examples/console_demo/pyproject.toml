[build-system]
requires = [
    "setuptools==84.0.0",
    "setuptools_scm==10.3.4",
]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "console_demo"

[tool.briefcase]
project_name = "Console Demo"
bundle = "org.beeware.examples"
url = "https://beeware.org"
license = "BSD-3-Clause"
license-files = ["../../LICENSE"]
author = "Kattni"
author_email = "hello@kattni.com"
description = "A demo of the toga-console widget."
# macOS, Linux, Windows, and iOS install the widget from this repository; Android
# installs it from a built wheel (run `uv build --wheel` from the repository root
# first), because Gradle rejects a path requirement whose directory contains the
# Android build tree.
requires = []
# `briefcase dev --test` runs the self-test; see tests/test_selftest.py.
test_sources = ["tests"]
test_requires = ["pytest"]

[tool.briefcase.app.console_demo]
formal_name = "Console Demo"
sources = ["src/console_demo"]

[tool.briefcase.app.console_demo.macOS]
requires = [
    "../..",
    "toga-cocoa ~= 0.5.7",
    "std-nslog >= 1.0.0",
]

# Toga refuses to guess when both Linux backends are installed, so this app uses GTK;
# the console_demo_qt app below runs the same demo on Qt.
[tool.briefcase.app.console_demo.linux]
requires = [
    "../..",
    "toga-gtk ~= 0.5.7",
]

[tool.briefcase.app.console_demo.windows]
requires = [
    "../..",
    "toga-winforms ~= 0.5.7",
]

[tool.briefcase.app.console_demo.iOS]
requires = [
    "../..",
    "toga-iOS ~= 0.5.7",
    "std-nslog >= 1.0.0",
]

[tool.briefcase.app.console_demo.android]
requirement_installer_args = [
    "-f", "../../dist",
    "--pre",
]
requires = [
    "toga_console",
    "toga-android ~= 0.5.7",
]
base_theme = "Theme.MaterialComponents.Light.DarkActionBar"
build_gradle_dependencies = [
    "com.google.android.material:material:1.12.0",
]

[tool.setuptools_scm]
root = "../../"

# The same demo on Qt, on any desktop platform: `briefcase dev -a console_demo_qt`.
# PySide6 comes from its wheels, so the app also runs in a venv whose Python has no
# system PySide6, as in CI.
[tool.briefcase.app.console_demo_qt]
formal_name = "Console Demo"
sources = [
    "src/console_demo_qt",
    "src/console_demo",
]
requires = [
    "../..",
    "toga-qt[pyside6-essentials] ~= 0.5.7",
]

[tool.pytest.ini_options]
# Stops pytest from taking the widget's own configuration from the repository root.
testpaths = ["tests"]
